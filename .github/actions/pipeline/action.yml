name: pipeline
description: >-
  Generate the build/merge/carry matrices from images.yaml + manifests
  (materialising recipe Dockerfiles on the way) and append the per-image
  docs to the job summary.
inputs:
  since:
    description: Base git revision for selective builds (empty = build everything).
    default: ""
  all:
    description: Rebuild every variant regardless of `since`.
    default: "false"
  max-depth:
    description: Deepest layer-N/merge-N job pair the calling workflow wires.
    default: "2"
outputs:
  layer0:
    value: ${{ steps.matrices.outputs.layer0 }}
  layer1:
    value: ${{ steps.matrices.outputs.layer1 }}
  layer2:
    value: ${{ steps.matrices.outputs.layer2 }}
  merge0:
    value: ${{ steps.matrices.outputs.merge0 }}
  merge1:
    value: ${{ steps.matrices.outputs.merge1 }}
  merge2:
    value: ${{ steps.matrices.outputs.merge2 }}
  carry:
    description: Variants not rebuilt this run, to retag from `edge`.
    value: ${{ steps.matrices.outputs.carry }}
  variants:
    description: Every variant of the pipeline (promotion matrix).
    value: ${{ steps.matrices.outputs.variants }}
  scan_severity:
    value: ${{ steps.matrices.outputs.scan_severity }}
  scan_ignore_unfixed:
    value: ${{ steps.matrices.outputs.scan_ignore_unfixed }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.2
    - id: matrices
      shell: bash
      env:
        SINCE: ${{ inputs.since }}
        ALL: ${{ inputs.all }}
        MAX_DEPTH: ${{ inputs.max-depth }}
      run: |
        uv run "${{ github.action_path }}/generate_pipeline.py" \
          --since "${SINCE}" $([ "${ALL}" = "true" ] && echo --all) --max-depth "${MAX_DEPTH}"
        for key in layer0 layer1 layer2 merge0 merge1 merge2 carry variants; do
          echo "${key}=$(jq -c ".${key}" github-matrices.json)" >> "$GITHUB_OUTPUT"
        done
        echo "scan_severity=$(jq -r '.scan.severity' github-matrices.json)" >> "$GITHUB_OUTPUT"
        echo "scan_ignore_unfixed=$(jq -r '.scan.ignoreUnfixed' github-matrices.json)" >> "$GITHUB_OUTPUT"
    - name: Per-image docs (job summary)
      shell: bash
      run: uv run "${{ github.action_path }}/generate_image_readme.py"
